[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vortex-research-runner"
version = "0.1.0"
description = "Generic high-throughput batch research and benchmarking engine"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vortex-runner-benchmark = "vortex_runner.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
