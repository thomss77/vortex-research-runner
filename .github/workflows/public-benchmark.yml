name: Public Runner Benchmark

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/public-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-runner-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout public project
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Run 100k parallel candidate benchmark
        run: |
          python -m vortex_runner.benchmark --count 100000 --workers auto --chunk-size 512 --json benchmark.json
          cat benchmark.json

      - name: Run generic numerical kernel benchmark
        run: |
          python -m vortex_runner.numeric_benchmark --count 1000000 --windows 20000 --json numeric-benchmark.json
          cat numeric-benchmark.json
